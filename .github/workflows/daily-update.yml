name: Daily data update

# 每天北京时间 08:00（UTC 00:00）自动重建数据并发布。
# GitHub 的 cron 在整点可能有几分钟到半小时的排队延迟，这是平台行为。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 提交并推送重新生成的数据
  pages: write      # 请求 GitHub Pages 重新构建

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild data and pages
        env:
          REFRESH_DATA: "1"
        run: |
          python scripts/build_backtest.py
          python scripts/build_technical.py
          python scripts/build_site.py
          python scripts/build_en.py

      - name: Verify data freshness
        run: |
          python - <<'PY'
          import datetime, json
          d = json.load(open("data/technical.json", encoding="utf-8"))
          end = datetime.date.fromisoformat(d["meta"]["windowEnd"])
          age = (datetime.date.today() - end).days
          print(f"Market data window end: {end} ({age} days old)")
          if age > 7:
              print(f"::warning::Market data is {age} days old — check the upstream data sources.")
          PY

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily data update ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages rebuild
        # 用 GITHUB_TOKEN 推送不会自动触发 pages-build-deployment，这里显式请求一次构建。
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          if [ "$code" = "201" ]; then
            echo "Pages rebuild queued."
          else
            echo "::warning::Pages rebuild request returned HTTP $code"
            cat "$RUNNER_TEMP/pages.json" || true
          fi
